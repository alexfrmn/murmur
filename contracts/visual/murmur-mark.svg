<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" color="#111418" role="img" aria-labelledby="murmur-mark-title" data-schema="murmur.mark/1">
  <title id="murmur-mark-title">Murmur — connected agents</title>
  <!-- Canonical source for both desktop companions. Menu-bar templates omit the color signal. -->
  <defs>
    <symbol id="murmur-ready" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="15" cy="24" r="4.5" fill="currentColor"/>
      <circle cx="33" cy="24" r="4.5" fill="currentColor"/>
      <path d="M15 24h18" fill="none" stroke="currentColor" stroke-width="3"/>
    </symbol>
    <symbol id="murmur-idle" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="15" cy="24" r="4.5" fill="currentColor"/>
      <circle cx="33" cy="24" r="4.5" fill="currentColor"/>
    </symbol>
    <symbol id="murmur-unread" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="15" cy="24" r="4.5" fill="currentColor"/>
      <circle cx="33" cy="24" r="4.5" fill="currentColor"/>
      <path d="M15 24h18" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="24" cy="14" r="3.5" fill="currentColor" data-overlay="unread"/>
    </symbol>
    <symbol id="murmur-failed" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="15" cy="24" r="4.5" fill="currentColor"/>
      <circle cx="33" cy="24" r="4.5" fill="currentColor"/>
      <path d="M15 24h5M28 24h5" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M24 11v7" fill="none" stroke="currentColor" stroke-width="3"/>
    </symbol>
  </defs>
  <use href="#murmur-ready"/>
  <rect x="32" y="5" width="6" height="4" fill="#D92027" data-role="color-signal"/>
</svg>
