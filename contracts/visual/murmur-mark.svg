<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="murmur-mark-title" data-schema="murmur.mark/2">
  <title id="murmur-mark-title">Murmur — two agents, one encrypted channel</title>
  <!-- Canonical source for both desktop companions. Derived from docs/images/murmur-logo.svg:
       same circle, same waves, same lock, wordmark dropped and the shapes thickened,
       because at 18 px the wordmark turns into noise and 3 px strokes vanish. -->
  <defs>
    <linearGradient id="murmur-live" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="murmur-quiet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b6b70"/><stop offset="100%" stop-color="#85858b"/>
    </linearGradient>
    <linearGradient id="murmur-alarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0392b"/><stop offset="100%" stop-color="#D92027"/>
    </linearGradient>
    <linearGradient id="murmur-attention-color" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A87700"/><stop offset="100%" stop-color="#BD8A0A"/>
    </linearGradient>

    <g id="murmur-glyph">
      <path d="M 28 46 Q 38 32, 48 46 Q 58 60, 48 74" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M 92 46 Q 82 32, 72 46 Q 62 60, 72 74" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <rect x="46" y="54" width="28" height="24" rx="4" fill="#fff"/>
      <path d="M 52 54 V 46 Q 52 36, 60 36 Q 68 36, 68 46 V 54" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>

    <symbol id="murmur-ready" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="58" fill="url(#murmur-live)"/>
      <use href="#murmur-glyph"/>
    </symbol>

    <symbol id="murmur-idle" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="58" fill="url(#murmur-quiet)"/>
      <use href="#murmur-glyph"/>
      <path d="M 22 99 H 42" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    </symbol>

    <symbol id="murmur-attention" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="58" fill="url(#murmur-attention-color)"/>
      <use href="#murmur-glyph"/>
      <path d="M 32 84 V 95" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="32" cy="106" r="4" fill="#fff"/>
    </symbol>

    <symbol id="murmur-unread" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="58" fill="url(#murmur-live)"/>
      <use href="#murmur-glyph"/>
      <circle cx="96" cy="24" r="22" fill="#D92027" stroke="#fff" stroke-width="6" data-overlay="unread"/>
    </symbol>

    <symbol id="murmur-failed" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="58" fill="url(#murmur-alarm)"/>
      <use href="#murmur-glyph"/>
      <path d="M 26 88 Q 33 95, 40 102 M 26 102 Q 33 95, 40 88" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    </symbol>
  </defs>

  <use href="#murmur-ready"/>
</svg>
