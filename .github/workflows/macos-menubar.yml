name: macOS menu bar contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-menubar-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check packaged launcher binding and environment
        run: python3 apps/macos-menubar/packaging/launcher-checks.py
      - name: Install isolated test broker binary
        run: brew install nats-server
      - name: Build engine and check portable setup behavior
        run: npm ci && npm run build && node --test tests/setup-*.test.mjs
      - name: First Contact recovery with isolated Servers and real retry timing
        run: node --test tests/pairing-first-contact.integration.mjs
      - uses: actions/setup-go@v5
        with:
          go-version-file: spikes/windows-service-go/go.mod
          cache-dependency-path: spikes/windows-service-go/go.sum
      - name: Install npm tarballs and probe the packaged CLI and MCP
        run: node scripts/test-npm-cli.mjs
      - name: Build native consumer after canonical fixture gate
        working-directory: apps/macos-menubar
        run: ./scripts/build-app.sh
      - name: Build and verify native DMG with the exact committed runtime
        shell: bash
        run: |
          node scripts/build-runtime-bundle.mjs --ref HEAD --out "$RUNNER_TEMP/mac-runtime"
          archives=("$RUNNER_TEMP/mac-runtime"/*.zip)
          test "${#archives[@]}" -eq 1
          ditto -x -k "${archives[0]}" "$RUNNER_TEMP/mac-runtime-extracted"
          apps/macos-menubar/packaging/build-dmg.sh "$RUNNER_TEMP/mac-dmg" "$RUNNER_TEMP/mac-runtime-extracted/runtime"
      - name: Preserve the versioned Mac companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-companion-dmg
          path: ${{ runner.temp }}/mac-dmg/Murmur-Mac-*-universal.dmg
          if-no-files-found: error
