name: macOS menu bar contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-menubar-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated test broker binary
        run: brew install nats-server
      - name: Build engine and check portable setup behavior
        run: npm ci && npm run build && node --test tests/setup-*.test.mjs
      - name: Build native consumer after canonical fixture gate
        working-directory: apps/macos-menubar
        run: ./scripts/build-app.sh
