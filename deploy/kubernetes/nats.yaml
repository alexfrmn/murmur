apiVersion: v1
kind: Secret
metadata:
  name: murmur-nats-auth
type: Opaque
stringData:
  NATS_USER: agent-k8s-demo
  NATS_PASSWORD_BCRYPT: CHANGE_ME_BCRYPT_HASH
---
apiVersion: v1
kind: Secret
metadata:
  name: murmur-nats-tls
type: Opaque
stringData:
  tls.crt: CHANGE_ME_SERVER_CERTIFICATE_PEM
  tls.key: CHANGE_ME_SERVER_PRIVATE_KEY_PEM
  ca.crt: CHANGE_ME_CA_CERTIFICATE_PEM
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: murmur-nats-config
data:
  nats.conf: |
    port: 4222
    http: 8222
    jetstream { store_dir: "/data/jetstream" }
    tls {
      cert_file: "/etc/nats/tls/tls.crt"
      key_file: "/etc/nats/tls/tls.key"
      timeout: 2
    }
    authorization {
      users: [
        {
          user: $NATS_USER
          password: $NATS_PASSWORD_BCRYPT
          permissions: {
            # Least privilege on the message plane: publish only to the peer this agent
            # talks to, subscribe only to its own inbound and ack subjects.
            #
            # The $JS.* and _INBOX entries are NOT optional when jetstream is enabled
            # above. JetStream is a request/reply API over regular subjects: stream and
            # consumer setup goes through $JS.API.*, message acknowledgement through
            # $JS.ACK.*, and every reply lands on an _INBOX.* subject minted per request.
            # Grant only msg.*/ack.* and the client authenticates fine, then fails on
            # ensureJetStream, the durable consumer and DLQ advisories — a permissions
            # error that reads like a broken transport. Drop these three lines only if
            # the jetstream block above is also removed.
            publish: [
              "msg.agent-peer",
              "ack.agent-peer",
              "$JS.API.>",
              "$JS.ACK.>"
            ]
            subscribe: [
              "msg.agent-k8s-demo",
              "ack.agent-k8s-demo",
              "_INBOX.>",
              "$JS.EVENT.ADVISORY.>"
            ]
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: murmur-nats
  labels:
    app.kubernetes.io/name: murmur-nats
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: murmur-nats
  ports:
    - name: nats
      port: 4222
      targetPort: nats
    - name: monitor
      port: 8222
      targetPort: monitor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: murmur-nats
  labels:
    app.kubernetes.io/name: murmur-nats
spec:
  serviceName: murmur-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: murmur-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: murmur-nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - exec nats-server -c /etc/nats/nats.conf
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: murmur-nats-auth
                  key: NATS_USER
            - name: NATS_PASSWORD_BCRYPT
              valueFrom:
                secretKeyRef:
                  name: murmur-nats-auth
                  key: NATS_PASSWORD_BCRYPT
          ports:
            - name: nats
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            tcpSocket:
              port: nats
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats/nats.conf
              subPath: nats.conf
              readOnly: true
            - name: nats-tls
              mountPath: /etc/nats/tls
              readOnly: true
      volumes:
        - name: nats-config
          configMap:
            name: murmur-nats-config
        - name: nats-tls
          secret:
            secretName: murmur-nats-tls
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
